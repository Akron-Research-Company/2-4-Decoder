name: Package Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create ZIP
        run: |
          zip -r 2-4-Decoder.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x "2-4-Decoder.zip"

      - name: Create or upload GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" > /dev/null 2>&1; then
            echo "Release already exists. Uploading ZIP..."
            gh release upload "${{ github.ref_name }}" \ 
              2-4-Decoder.zip \
              --clobber
          else
            echo "Release does not exist. Creating it..."
            gh release create "${{ github.ref_name }}" \
              2-4-Decoder.zip \
              --generate-notes
          fi