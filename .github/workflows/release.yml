name: Package Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create archives
        run: |
          # ZIP
          zip -r 2-4-Decoder.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x "2-4-Decoder.zip" \
            -x "2-4-Decoder.tar" \
            -x "2-4-Decoder.tar.gz"

          # TAR
          tar \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="2-4-Decoder.zip" \
            --exclude="2-4-Decoder.tar" \
            --exclude="2-4-Decoder.tar.gz" \
            -cf 2-4-Decoder.tar .

          # TAR.GZ
          tar \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="2-4-Decoder.zip" \
            --exclude="2-4-Decoder.tar" \
            --exclude="2-4-Decoder.tar.gz" \
            -czf 2-4-Decoder.tar.gz .

      - name: Check archives
        run: |
          ls -lh \
            2-4-Decoder.zip \
            2-4-Decoder.tar \
            2-4-Decoder.tar.gz

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists."
            echo "Replacing existing archives..."

            gh release upload "$TAG" \
              "./2-4-Decoder.zip" \
              "./2-4-Decoder.tar" \
              "./2-4-Decoder.tar.gz" \
              --clobber
          else
            echo "Release $TAG does not exist."
            echo "Creating release..."

            gh release create "$TAG" \
              "./2-4-Decoder.zip" \
              "./2-4-Decoder.tar" \
              "./2-4-Decoder.tar.gz" \
              --generate-notes
          fi