name: Package Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create archives
        run: | 
          mkdir -p /tmp/2-4-Decoder

          zip -r /tmp/2-4-Decoder/2-4-Decoder.zip . \
            -x ".git/*" \
            -x ".github/*"

          tar \
            --exclude=".git" \
            --exclude=".github" \
            -cf /tmp/2-4-Decoder/2-4-Decoder.tar .

          tar \
            --exclude=".git" \
            --exclude=".github" \
            -czf /tmp/2-4-Decoder/2-4-Decoder.tar.gz .

          cp /tmp/2-4-Decoder/* .  

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists."
            echo "Replacing existing archives..."

            gh release upload "$TAG" \
              "./2-4-Decoder.zip" \
              "./2-4-Decoder.tar" \
              "./2-4-Decoder.tar.gz" \
              --clobber
          else
            echo "Release $TAG does not exist."
            echo "Creating release..."

            gh release create "$TAG" \
              "./2-4-Decoder.zip" \
              "./2-4-Decoder.tar" \
              "./2-4-Decoder.tar.gz" \
              --generate-notes
          fi